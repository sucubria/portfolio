<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page introuvable — Simon Vallée</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <style>
    :root { --bg: #f7f4ef; --ink: #14202e; --muted: #4f5b6b; --accent: #0d6e67; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0e161f; --ink: #edf1f4; --muted: #a8b3bf; --accent: #5cc7bb; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; background: var(--bg); color: var(--ink); font: 1.0625rem/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
    h1 { margin: 0 0 .5rem; font: 600 clamp(2rem, 6vw, 3rem)/1.1 Georgia, serif; }
    p { color: var(--muted); }
    a { color: var(--accent); font-weight: 600; }
    .code { font: 700 5rem/1 Georgia, serif; color: var(--accent); margin: 0; }
  </style>
</head>
<body>
  <main>
    <p class="code" aria-hidden="true">404</p>
    <h1>Page introuvable</h1>
    <p>Cette page n’existe pas ou a été déplacée.</p>
    <p><a href="https://simonvallee.fr/">Retour à l’accueil</a></p>
    <p lang="en">Page not found — <a href="https://simonvallee.fr/en/">back to the home page</a>.</p>
  </main>
</body>
</html>
